spring.application.name=techzone-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/proyecto?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# never: el script database/script_mysql.sql se ejecuta a mano en el gestor.
# Si se dejara en "always", Spring volveria a correr los INSERT en cada arranque
# y fallaria con "Duplicate entry" en las claves primarias.
spring.sql.init.mode=never

app.cors.allowed-origin=http://localhost:5173
