spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyecto?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=false

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.jwt.secret=${JWT_SECRET:techzone-super-secret-key-change-in-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
